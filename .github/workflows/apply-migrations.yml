name: Apply Supabase Migrations

# Trigger this workflow when changes are pushed to master in the migrations folder
on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply migrations
        run: |
          db_url="${{ secrets.SUPABASE_DB_URL }}"

          if [[ "$db_url" == *"sslmode="* ]]; then
            final_db_url="$db_url"
          elif [[ "$db_url" == *"?"* ]]; then
            final_db_url="${db_url}&sslmode=disable"
          else
            final_db_url="${db_url}?sslmode=disable"
          fi

          npx supabase@latest db push --db-url "$final_db_url" --debug
