name: Deploy Supabase Functions

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Package functions
        run: |
          cd ./supabase/functions
          shopt -s dotglob nullglob
          files=(*)
          tar -cf ../../functions.tar "${files[@]}"

      - name: Upload archive to VPS
        run: |
          scp -p -P ${{ secrets.VPS_SSH_PORT }} \
            functions.tar \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:"${{ secrets.VPS_FUNCTIONS_FOLDER }}/functions.tar"

      - name: Extract archive on VPS
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd '${{ secrets.VPS_FUNCTIONS_FOLDER }}' && tar --no-same-owner --no-same-permissions --no-overwrite-dir --touch -xf functions.tar && rm -f functions.tar"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f functions.tar

